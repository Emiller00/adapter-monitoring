[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adapter-monitoring"
version = "0.1.0"
description = "Verification and rerun tools for GLNet monitoring experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gpu = [
  "numpy>=1.24,<3",
  "PyYAML>=5.4,<7",
  "torch>=2.2",
  "accelerate>=1.0,<2",
  "bitsandbytes>=0.45,<1",
  "huggingface-hub>=0.26,<2",
  "peft>=0.13,<0.21",
  "scikit-learn>=1.4,<2",
  "safetensors>=0.4,<1",
  "transformers>=4.45,<6",
]

[project.scripts]
adapter-monitoring = "adapter_monitoring.__main__:main"

[tool.setuptools]
packages = ["adapter_monitoring"]

[tool.setuptools.package-data]
adapter_monitoring = ["evidence/*.json", "evidence/*.jsonl"]
